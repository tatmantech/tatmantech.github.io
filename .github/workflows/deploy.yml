name: Deploy Zola site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Zola
        run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/getzola/zola:v0.23.3 build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          # Default retention is 1 day, which is too short for a human-approval
          # review gate -- a build that sits waiting for approval over a weekend
          # would expire before it can be deployed. 7 days matches our weekly
          # review cadence.
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
